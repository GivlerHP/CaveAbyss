buildscript {
    repositories {
        mavenCentral()
        maven { name = "forge"; url = "https://maven.minecraftforge.net/" }
        maven { name = "sonatype"; url = "https://oss.sonatype.org/content/repositories/snapshots/" }
    }
    dependencies {
        classpath ('com.anatawa12.forge:ForgeGradle:1.2-1.1.+') { changing = true }
    }
}

apply plugin: 'forge'
apply plugin: 'idea'

project.sourceCompatibility = '1.8'
project.targetCompatibility = '1.8'

version = "1.0.2.37"
group = "ru.givler.caveabyss"
archivesBaseName = "CaveAbyss"

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
    replace "@VERSION@", project.version
}

repositories {
    mavenCentral()
    maven { name = "chickenbones"; url = "https://chickenbones.net/maven/" }
    flatDir { dirs 'libs' }
}

dependencies {
    implementation name: 'geckolib-unofficial-1.7.10-1.0.4-dev'
    implementation name: 'AriamisBOB'
    implementation name: 'MF2-dev'
    implementation name: 'Baubles-1.7.10-1.0.1.10-dev'
    implementation name: 'Thaumcraft-4-Ariamis-4.2.4.0-deobf'
    implementation name: 'CodeChickenLib-1.7.10-1.1.3.141-universal'
    implementation name: 'CodeChickenCore-1.7.10-1.0.7.48-universal'
}

jar {
    from sourceSets.main.output
    manifest {
        attributes(
                'FMLCorePlugin': 'ru.givler.caveabyss.core.CaveAbyssCorePlugin',
                'FMLCorePluginContainsFMLMod': 'true'
        )
    }
}

task deobfJar(type: Jar) {
    from sourceSets.main.output
    classifier = 'deobf'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:unchecked'
}

idea {
    module {
        inheritOutputDirs = true
    }
}

tasks.build.dependsOn('deobfJar')

task verifyCoreTransforms(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    main = 'ru.givler.caveabyss.core.CorePatchSmoke'
}

tasks.check.dependsOn('verifyCoreTransforms')

task verifyFractalCaves(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    main = 'ru.givler.caveabyss.world.abyss.FractalCavesSmoke'
}

tasks.check.dependsOn('verifyFractalCaves')

task verifyAbyssTerrain(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    main = 'ru.givler.caveabyss.world.abyss.AbyssTerrainSmoke'
    jvmArgs '-Djava.awt.headless=true'
}

tasks.check.dependsOn('verifyAbyssTerrain')

processResources {
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
