buildscript {
    repositories {
        mavenCentral()
        maven { name = "forge"; url = "https://maven.minecraftforge.net/" }
        maven { name = "sonatype"; url = "https://oss.sonatype.org/content/repositories/snapshots/" }
    }
    dependencies {
        classpath ('com.anatawa12.forge:ForgeGradle:1.2-1.1.+') { changing = true }
    }
}

apply plugin: 'forge'
apply plugin: 'idea'

project.sourceCompatibility = '1.8'
project.targetCompatibility = '1.8'

version = "1.0.2.61"
group = "ru.givler.caveabyss"
archivesBaseName = "CaveAbyss"

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
    replace "@VERSION@", project.version
}

repositories {
    mavenCentral()
    maven { name = "chickenbones"; url = "https://chickenbones.net/maven/" }
    flatDir { dirs 'libs' }
}

dependencies {
    implementation fileTree(dir: 'libs', include: '*.jar')
}

// Dependencies are MCP-mapped dev JARs in libs. UniMixins must bootstrap first.
afterEvaluate {
    tasks.matching { it.name == 'runClient' || it.name == 'run' }.all {
        classpath = files('libs/AAunimixins-all-1.7.10-0.3.1.jar') + classpath
        args '--tweakClass', 'org.spongepowered.asm.launch.MixinTweaker'
        jvmArgs '-noverify'
        systemProperty 'org.lwjgl.librarypath', file('.dev-dependencies/natives').absolutePath
    }
}


jar {
    from sourceSets.main.output
    manifest {
        attributes(
                'FMLCorePlugin': 'ru.givler.caveabyss.core.CaveAbyssCorePlugin',
                'FMLCorePluginContainsFMLMod': 'true'
        )
    }
}

task deobfJar(type: Jar) {
    from sourceSets.main.output
    classifier = 'deobf'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:unchecked'
}

idea {
    module {
        inheritOutputDirs = true
    }
}

tasks.build.dependsOn('deobfJar')

task verifyCoreTransforms(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    main = 'ru.givler.caveabyss.core.CorePatchSmoke'
}

tasks.check.dependsOn('verifyCoreTransforms')

task verifyProductionTransforms(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    main = 'ru.givler.caveabyss.core.ProductionTransformSmoke'
    args new File(gradle.gradleUserHomeDir, 'caches/minecraft/net/minecraftforge/forge/1.7.10-10.13.4.1614-1.7.10').absolutePath
    if (project.hasProperty('compatMods')) {
        args project.property('compatMods')
        args new File(gradle.gradleUserHomeDir, 'caches/minecraft/net/minecraft/minecraft/1.7.10/minecraft-1.7.10.jar').absolutePath
    }
}

tasks.check.dependsOn('verifyProductionTransforms')

// Explicitly invoked only for the isolated Angelica migration world test.
task migrationProbeJar(type: Jar, dependsOn: testClasses) {
    archiveBaseName = 'AngelicaMigrationProbe'
    archiveVersion = '1'
    from sourceSets.test.output
    include '**/AngelicaWorldProbe.class'
}

processResources {
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

// Read-only validation; does not launch Minecraft.
task verifyDevDependencies {
    doLast {
        def cp = tasks.runClient.classpath.files
        if (cp.any { it.parentFile?.name == '.dev-dependencies' }) throw new GradleException('Dev JARs must come from libs')
        ['MoreBeyondOrdinary-1.26.27-deobf.jar', 'MF2-dev.jar', 'angelica-2.2.33-dev.jar', 'gtnhlib-0.11.54-dev.jar'].each { name ->
            if (cp.count { it.name == name } != 1) throw new GradleException("Missing/duplicate dev dependency: " + name)
        }
        if (cp.any { it.name == 'MoreBeyondOrdinary-1.26.0-deobf.jar' || it.name == 'CodeChickenCore-1.7.10-1.0.7.48-universal.jar' })
            throw new GradleException('Old MBO/CodeChickenCore on dev runtime')
        file('build/dev-dependencies.list').text = cp.collect { it.absolutePath }.join('\n')
        println 'Dev runtime: current MBO/MF2, Angelica, GTNHLib and UniMixins; old renderer dependencies excluded'
    }
}
tasks.check.dependsOn verifyDevDependencies
